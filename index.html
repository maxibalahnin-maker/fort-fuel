<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мониторинг топлива — Бетон04</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 24px; min-height: 100vh;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 24px; font-weight: 600; color: #f8fafc; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
  .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .dot.loading { background: #eab308; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; transition: transform 0.15s, border-color 0.15s; }
  .card:hover { transform: translateY(-2px); border-color: #475569; }
  .card.low { border-color: #ef4444; }
  .card.medium { border-color: #f59e0b; }

  .obj-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj-id { font-size: 12px; color: #64748b; margin-bottom: 16px; }

  .fuel-value { font-size: 36px; font-weight: 700; color: #38bdf8; line-height: 1; margin-bottom: 4px; }
  .fuel-value.low { color: #ef4444; }
  .fuel-value.medium { color: #f59e0b; }

  .fuel-label { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
  .fuel-bar { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .fuel-bar-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #38bdf8); transition: width 0.5s; border-radius: 3px; }
  .fuel-bar-fill.low { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .fuel-bar-fill.medium { background: linear-gradient(90deg, #d97706, #f59e0b); }

  .meta { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; border-top: 1px solid #334155; padding-top: 12px; margin-top: 4px; }
  .meta span { display: flex; flex-direction: column; gap: 2px; }
  .meta b { color: #e2e8f0; font-weight: 500; }
  .sensor-name { font-size: 11px; color: #64748b; margin-top: 8px; font-style: italic; }

  .empty-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px dashed #475569; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; text-align: center; min-height: 180px; grid-column: 1 / -1; }
  .error { background: #7f1d1d; color: #fecaca; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .last-update { font-size: 12px; color: #64748b; margin-top: 16px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>Мониторинг топлива</h1>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Подключение...</span>
  </div>
</div>

<div id="errorBox"></div>
<div class="grid" id="grid"></div>
<div class="last-update" id="lastUpdate"></div>

<script>
var MAX_FUEL = 100;
var REFRESH_SECONDS = 30;
var sessionId = null;
var sessionTimer = null;

function $(id) { return document.getElementById(id); }

function setStatus(state, text) {
  var dot = $('statusDot');
  dot.className = 'dot' + (state ? ' ' + state : '');
  $('statusText').textContent = text;
}

function showError(msg) {
  $('errorBox').innerHTML = msg ? '<div class="error">' + msg + '</div>' : '';
}

async function update() {
  try {
    var res = await fetch('/api/fuel', { cache: 'no-store' });
    var json = await res.json();

    if (json.error) throw new Error(json.error);

    render(Array.isArray(json) ? json : []);setStatus('online', 'Обновлено');
    showError('');
    $('lastUpdate').textContent = 'Последнее обновление: ' + new Date().toLocaleTimeString('ru-RU');
  } catch (e) {
    console.error(e);
    setStatus('', 'Ошибка');
    showError('Ошибка: ' + e.message);
  }
}

function render(data) {
  var grid = $('grid');
  grid.innerHTML = '';

  if (!data || data.length === 0) {
    grid.innerHTML = '<div class="empty-card">Нет данных по объектам за последние 30 минут</div>';
    return;
  }

  data.forEach(function(obj) {
    var sensor = (obj.sensors && obj.sensors[0]) || null;
    var fuel = sensor ? sensor.endLevel : null;
    var consumption = sensor ? (sensor.consumption || 0) : 0;
    var refuelings = sensor ? (sensor.summ_refuelings || 0) : 0;
    var sensorName = sensor ? (sensor.sensor_name || 'ДУТ') : 'Датчик не найден';

    var level = 'ok';
    if (fuel === null || fuel === undefined) level = 'error';
    else if (fuel < 10) level = 'low';
    else if (fuel < 25) level = 'medium';

    var percent = fuel !== null && fuel !== undefined
      ? Math.min(100, Math.max(0, (fuel / MAX_FUEL) * 100)) : 0;

    var fuelDisplay = (fuel !== null && fuel !== undefined) ? fuel.toFixed(2) : '—';
    var fuelClass = level === 'low' ? 'low' : level === 'medium' ? 'medium' : '';
    var cardClass = level === 'low' ? 'low' : level === 'medium' ? 'medium' : '';

    var card = document.createElement('div');
    card.className = 'card ' + cardClass;
    card.innerHTML =
      '<div class="obj-name">' + (obj.object_name || 'Без названия') + '</div>' +
      '<div class="obj-id">ID: ' + obj.object_id + '</div>' +
      '<div class="fuel-value ' + fuelClass + '">' + fuelDisplay + '<span style="font-size:18px;color:#64748b;"> л</span></div>' +
      '<div class="fuel-label">Текущий уровень топлива</div>' +
      '<div class="fuel-bar"><div class="fuel-bar-fill ' + fuelClass + '" style="width:' + percent + '%"></div></div>' +
      '<div class="meta">' +
        '<span>Расход<b>' + consumption.toFixed(2) + ' л</b></span>' +
        '<span>Заправки<b>' + refuelings.toFixed(2) + ' л</b></span>' +
      '</div>' +
      '<div class="sensor-name">' + sensorName + '</div>';

    grid.appendChild(card);
  });
}

update();
setInterval(update, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
